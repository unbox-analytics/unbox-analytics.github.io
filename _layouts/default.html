---
# new `_layouts/default.html` for backwards-compatibility when multiple
# layouts have been customized.

layout: default
---
<head>
<meta name="google-site-verification" content="uLv2K77YBhZCF9-RQDHh63Vt2UkNSAx1YFxOAEeKgGY" />
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root {
    color-scheme: light;
    font-family: 'Open Sans', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    letter-spacing: 0.01em;
    color: #2c3e50;
    background-color: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #fafaf8;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #f0ebe3;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.logo {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-logo,
.brand-name-image {
    display: block;
    width: auto;
    max-height: 44px;
}

.brand-name-image {
    max-height: 32px;
}

.brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.brand-name {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.18em;
    font-weight: 700;
    color: #2c3e50;
    text-transform: uppercase;
}

.brand-subtitle {
    font-size: 0.85rem;
    color: #4a5f75;
    font-weight: 500;
}

.nav-center {
    display: flex;
    gap: 32px;
    flex: 1;
    justify-content: center;
}

.nav-center a {
    text-decoration: none;
    color: #2c3e50;
    font-weight: 500;
    font-size: 0.95rem;
    transition: color 0.2s ease;
    position: relative;
}

.nav-center a:hover {
    color: #d4a574;
}

.nav-center a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: #d4a574;
    transition: width 0.2s ease;
}

.nav-center a:hover::after {
    width: 100%;
}

.cta-button {
    flex-shrink: 0;
    background: #d4a574;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(212, 165, 116, 0.2);
}

.cta-button:hover {
    background: #c49564;
    box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
    transform: translateY(-2px);
}

.MainBody {
    margin: 0 auto;
    padding: 32px 24px 48px;
    max-width: 960px;
    width: min(100%, 960px);
}

h1, h2, h3, h4, h5, h6 {
    font-family: 'Poppins', sans-serif;
    line-height: 1.08;
    margin-top: 1.8em;
    margin-bottom: 0.6em;
    color: #1b3a52;
}

h2 {
    font-size: 2rem;
    color: #d4a574;
}

h3 {
    font-size: 1.45rem;
}

p, li, blockquote {
    font-size: 1rem;
    line-height: 1.6;
    margin: 1.2em 0;
    color: #4a5f75;
}

p + p,
li + li {
    margin-top: 1rem;
}

ul, ol {
    padding-left: 1.4rem;
    margin: 1rem 0 1.4rem;
}

hr {
    border: none;
    border-top: 1px solid #f0ebe3;
    margin: 2.2rem 0;
}

img {
    max-width: 100%;
    height: auto;
}

em, strong {
    color: #2c3e50;
}

.footer {
    margin: 32px auto 0;
    padding: 24px 24px 12px;
    max-width: 960px;
    text-align: center;
    color: #8b9db0;
    font-size: 0.95rem;
    border-top: 1px solid #f0ebe3;
}

.footer a {
    color: #2c3e50;
    text-decoration: none;
    font-weight: 600;
}

.footer a:hover {
    color: #d4a574;
}

@media (max-width: 768px) {
    :root {
        font-size: 16px;
    }

    .header-container {
        padding: 12px 16px;
        gap: 16px;
    }

    .nav-center {
        display: none;
    }

    .MainBody {
        padding: 24px 16px 36px;
    }

    h2 {
        font-size: 1.65rem;
    }

    h3 {
        font-size: 1.25rem;
    }
}
</style>

<header>
    <div class="header-container">
        <div class="logo">
            <img class="brand-logo" src="{{ '/Assets/transparent_Logo_png.png' | relative_url }}" alt="Unbox Analytics logo" />
            <img class="brand-name-image" src="{{ '/Assets/transparent_Name_png.png' | relative_url }}" alt="Unbox Analytics name" />
        </div>
        <nav class="nav-center">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
            <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
        <a href="#contact" class="cta-button">Contact Us</a>
    </div>
</header>
<div class="MainBody">
    {{ content }}
</div>
<div class="footer">
    <p>© {{ site.time | date: '%Y' }} Unbox Analytics · Built with Jekyll</p>
    <p><a href="{{ '/' | relative_url }}">Home</a> · <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a> · <a href="{{ '/about/' | relative_url }}">About</a></p>
</div>
